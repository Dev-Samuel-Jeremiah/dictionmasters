<!DOCTYPE html>
<html lang="en-gb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Diction Masters — offline</title>
  <!--
    Shown by the app when the website can't be reached.
    It lives INSIDE the app, so changing it needs `npm run sync` and a new
    store release. Keep it simple.
  -->
  <script src="app-settings.js"></script>
  <style>
    :root { --navy: #14213D; --gold: #F3D38D; --ink: #FFFDF8; --muted: #B9C3DA; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: linear-gradient(135deg, #24375F, var(--navy) 60%, #0C1428);
      color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      display: grid; place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      text-align: center;
    }
    .card { max-width: 420px; }
    svg { width: 96px; height: 96px; margin-bottom: 20px; }
    h1 { font-size: 24px; margin: 0 0 10px; }
    p { color: var(--muted); margin: 0 0 28px; }
    button {
      appearance: none; border: 0; border-radius: 999px; cursor: pointer;
      background: var(--gold); color: var(--navy);
      font: 700 17px/1 inherit; padding: 16px 34px; min-width: 200px;
    }
    button:active { transform: scale(.97); }
    .status { margin-top: 18px; font-size: 14px; color: var(--muted); min-height: 1.5em; }
  </style>
</head>
<body>
  <main class="card">
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <circle cx="256" cy="256" r="118.5" fill="none" stroke="#F3D38D" stroke-width="15"/>
      <path d="M202.5 296V196.5H300M202.5 252H268.5" fill="none" stroke="#F3D38D" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="310" cy="195.5" r="13.5" fill="#F3D38D"/>
    </svg>
    <h1>You're offline</h1>
    <p>Diction Masters needs the internet to open. Check your data or Wi-Fi, then try again. Lessons you saved for offline will open once the app reconnects.</p>
    <button type="button" id="retry">Try again</button>
    <div class="status" id="status" role="status"></div>
  </main>
  <script>
    (function () {
      var site = (window.DM_SETTINGS && window.DM_SETTINGS.siteUrl) || "https://www.dictionmasters.app";
      var status = document.getElementById("status");
      var plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
      if (plugins.SplashScreen) plugins.SplashScreen.hide().catch(function () {});

      function retry() {
        status.textContent = "Connecting…";
        // A tiny request first, so we don't swap this screen for a browser error.
        fetch(site + "/manifest.webmanifest", { cache: "no-store", mode: "no-cors" })
          .then(function () { window.location.href = site + "/"; })
          .catch(function () { status.textContent = "Still no connection. We'll reconnect automatically."; });
      }
      document.getElementById("retry").addEventListener("click", retry);
      window.addEventListener("online", retry);
      if (plugins.Network) {
        plugins.Network.addListener("networkStatusChange", function (s) { if (s.connected) retry(); });
      }
    })();
  </script>
</body>
</html>
