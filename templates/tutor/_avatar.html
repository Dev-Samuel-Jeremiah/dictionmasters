{% comment %}
  The face that reads with the learner. It blinks on its own, and while
  the tutor speaks its mouth moves (static/js/tutor_avatar.js adds
  "is-speaking"). Pass `avatar` (the style), `name`, and `size` in pixels.
{% endcomment %}
<figure class="av av--{{ avatar|default:'yela' }}" data-avatar style="--av-size: {{ size|default:132 }}px" aria-label="{{ name|default:'Your tutor' }}">
  <svg viewBox="0 0 160 160" role="img" aria-hidden="true" class="av__art">
    <defs>
      <radialGradient id="av-bg-{{ avatar }}{{ suffix }}" cx="35%" cy="25%">
        <stop offset="0%" class="av__bg-from"/><stop offset="100%" class="av__bg-to"/>
      </radialGradient>
      <clipPath id="av-clip-{{ avatar }}{{ suffix }}"><circle cx="80" cy="80" r="74"/></clipPath>
    </defs>

    <circle cx="80" cy="80" r="74" fill="url(#av-bg-{{ avatar }}{{ suffix }})"/>
    <g clip-path="url(#av-clip-{{ avatar }}{{ suffix }})">

      {% if avatar == "orb" %}
      {# No face: a listening orb that pulses as it speaks. #}
      <circle cx="80" cy="82" r="40" class="av__orb"/>
      <circle cx="80" cy="82" r="26" class="av__orb-inner"/>
      <g class="av__wave">
        <rect x="62" y="74" width="6" height="16" rx="3"/>
        <rect x="74" y="66" width="6" height="32" rx="3"/>
        <rect x="86" y="70" width="6" height="24" rx="3"/>
        <rect x="98" y="76" width="6" height="12" rx="3"/>
      </g>

      {% else %}
      {# Shoulders, neck and head, then the hair for this style. #}
      <path class="av__clothes" d="M20 168c6-26 28-40 60-40s54 14 60 40z"/>
      <path class="av__skin" d="M66 112h28v18c0 8-28 8-28 0z"/>
      <ellipse class="av__skin" cx="80" cy="76" rx="34" ry="39"/>
      <ellipse class="av__skin av__ear" cx="46" cy="78" rx="6" ry="9"/>
      <ellipse class="av__skin av__ear" cx="114" cy="78" rx="6" ry="9"/>

      {% if avatar == "yela" %}
      <path class="av__hair" d="M80 30c-24 0-38 16-38 36 0 6 1 11 3 15 1-14 5-22 9-26 8 8 20 11 34 9 9-1 16-4 21-8 3 5 5 13 6 25 2-4 3-9 3-15 0-20-14-36-38-36z"/>
      <g class="av__braids">
        <path d="M44 66c-8 14-9 34-4 52" /><path d="M116 66c8 14 9 34 4 52"/>
        <path d="M38 70c-9 16-10 36-5 54"/><path d="M122 70c9 16 10 36 5 54"/>
      </g>
      <circle class="av__hoop" cx="46" cy="92" r="7"/><circle class="av__hoop" cx="114" cy="92" r="7"/>

      {% elif avatar == "ada" %}
      <path class="av__hair" d="M80 28c-22 0-37 15-37 34 0 7 2 13 5 17-1-13 2-20 5-24 9 7 21 10 34 8 9-1 16-4 21-8 3 4 5 11 5 24 3-4 5-10 5-17 0-19-16-34-38-34z"/>
      <g class="av__curls">
        <circle cx="48" cy="52" r="9"/><circle cx="62" cy="40" r="10"/><circle cx="80" cy="35" r="11"/>
        <circle cx="98" cy="40" r="10"/><circle cx="112" cy="52" r="9"/>
      </g>
      <g class="av__glasses">
        <circle cx="66" cy="80" r="13"/><circle cx="94" cy="80" r="13"/><path d="M79 80h2"/>
        <path d="M53 78h-7"/><path d="M107 78h7"/>
      </g>

      {% elif avatar == "nia" %}
      <path class="av__wrap" d="M80 26c-26 0-42 17-42 38 0 5 1 9 2 12l14-6c-2-16 8-28 26-28s28 12 26 28l14 6c1-3 2-7 2-12 0-21-16-38-42-38z"/>
      <path class="av__wrap av__wrap--knot" d="M112 34c10-6 22-4 26 4 4 9-3 18-14 19-8 1-14-3-16-9z"/>
      <path class="av__hair" d="M52 68c2-12 12-20 28-20s26 8 28 20c-8-6-18-9-28-9s-20 3-28 9z"/>

      {% elif avatar == "kayode" %}
      <path class="av__hair" d="M80 32c-21 0-35 13-35 30 0 4 0 7 1 10 3-11 6-17 10-20 9 6 20 9 31 8 8-1 15-3 20-7 4 3 7 9 9 19 1-3 1-6 1-10 0-17-16-30-37-30z"/>
      <path class="av__beard" d="M48 82c0 26 14 42 32 42s32-16 32-42c-3 20-15 30-32 30s-29-10-32-30z"/>

      {% elif avatar == "tobi" %}
      <path class="av__hair" d="M80 34c-20 0-34 11-34 26 0 3 0 5 1 7 5-8 8-12 12-14 8 5 17 7 27 7 8 0 15-2 20-5 4 2 7 6 11 12 1-2 1-4 1-7 0-15-18-26-38-26z"/>
      <path class="av__fade" d="M46 62c10-6 22-9 34-9s24 3 34 9c-2-4-4-7-7-9-8-5-17-7-27-7s-19 2-27 7c-3 2-5 5-7 9z"/>
      {% endif %}

      {# Eyes, brows and the mouth that moves. #}
      <g class="av__brows"><path d="M58 64c5-4 12-4 17-1"/><path d="M85 63c5-3 12-3 17 1"/></g>
      <g class="av__eyes">
        <ellipse class="av__white" cx="66" cy="78" rx="8" ry="6"/>
        <ellipse class="av__white" cx="94" cy="78" rx="8" ry="6"/>
        <circle class="av__pupil" cx="66" cy="78" r="3.4"/>
        <circle class="av__pupil" cx="94" cy="78" r="3.4"/>
        <circle class="av__spark" cx="67.4" cy="76.6" r="1.1"/>
        <circle class="av__spark" cx="95.4" cy="76.6" r="1.1"/>
        <g class="av__lids"><ellipse cx="66" cy="78" rx="8.4" ry="6.4"/><ellipse cx="94" cy="78" rx="8.4" ry="6.4"/></g>
      </g>
      <ellipse class="av__blush" cx="56" cy="92" rx="7" ry="4"/>
      <ellipse class="av__blush" cx="104" cy="92" rx="7" ry="4"/>
      <path class="av__nose" d="M80 82v8c0 2-2 3-4 3"/>
      <g class="av__mouth">
        <path class="av__lips" d="M68 100c4 5 20 5 24 0 0 0-4 10-12 10s-12-10-12-10z"/>
        <ellipse class="av__teeth" cx="80" cy="101" rx="9" ry="2"/>
      </g>
      {% endif %}
    </g>
    <circle cx="80" cy="80" r="74" class="av__ring"/>
  </svg>
  <span class="av__sound" aria-hidden="true"><i></i><i></i><i></i></span>
</figure>
