{# The Diction Masters mark and name. An uploaded logo (control panel > Branding) replaces the drawn mark. #}
<a href="{{ brand_href|default:'/' }}" class="brand px-brand">
  {% if branding.logo %}
    <img src="{% url 'pwa_brand_asset' 'logo' %}?v={{ branding.updated_at|date:'U' }}" alt="{% if not branding.show_name_with_logo %}Diction Masters{% endif %}" class="brand__logo px-brand__logo">
  {% else %}
    <span class="px-brand__mark" aria-hidden="true">
      <svg width="38" height="42" viewBox="0 0 38 42"><rect width="38" height="42" rx="6" fill="#1846E0" stroke="#fff" stroke-opacity=".35"/><path d="M8 8l11 9 11-9v12c0 7-5 11-11 11S8 27 8 20z" fill="#fff"/><path d="M13 19c1.5 3 4 4.5 6 4.5s4.5-1.5 6-4.5" stroke="#1846E0" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M12 33l7 3.5-7 3.5zM26 33l-7 3.5 7 3.5z" fill="#FFC72C"/></svg>
    </span>
  {% endif %}
  {% if not branding.logo or branding.show_name_with_logo %}<span class="px-brand__name">Diction<br><span>Masters</span></span>{% endif %}
</a>
