{# One account in the switcher: tap to switch, × to take it off this device. Needs `p`. #}
<li class="px-switch__row">
  <form method="post" action="{% url 'accounts:switch_account' %}" class="px-switch__go">
    {% csrf_token %}
    <input type="hidden" name="user" value="{{ p.pk }}">
    <button type="submit" class="px-switch__pick">
      <span class="px-switch__face px-switch__face--{% if p.pk|divisibleby:2 %}b{% else %}c{% endif %}" aria-hidden="true">{{ p.first_name|first|upper }}{{ p.last_name|first|upper }}</span>
      <span class="px-switch__who">
        <strong>{{ p.get_full_name|default:p.login_name }}</strong>
        <small>{% if p.is_staff or p.is_superuser %}Admin{% else %}{{ p.get_role_display }}{% endif %}{% if p.level %} · {{ p.level }}{% endif %}{% if p.username %} · {{ p.username }}{% endif %}</small>
      </span>
      <span class="px-switch__arrow" aria-hidden="true">{% if p.switch_locked %}&#128274; Password{% else %}{{ action|default:"Switch" }} &rsaquo;{% endif %}</span>
    </button>
  </form>
  <form method="post" action="{% url 'accounts:remove_account' %}" class="px-switch__drop">
    {% csrf_token %}
    <input type="hidden" name="user" value="{{ p.pk }}">
    <input type="hidden" name="next" value="{{ request.path }}">
    <button type="submit" class="px-switch__x" aria-label="Remove {{ p.get_full_name|default:p.login_name }} from this device" title="Remove from this device" data-confirm="Remove {{ p.get_full_name|default:p.login_name }} from this device? They can sign in again any time.">&times;</button>
  </form>
</li>
